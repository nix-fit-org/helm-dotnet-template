---
{{- with .Values.app.secrets.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-env
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
{{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if and .Values.app.secrets.env .Values.app.migrations.enabled }}
{{- with .Values.app.secrets.env }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-env-migrations
  namespace: {{ $.Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
{{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
---
{{- with .Values.app.secrets.certificates }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-certificates
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
{{- range . }}
  {{ .fileName }}: |-
{{ .cert | nindent 4 }}
{{- end }}
{{- end }}
{{- if and .Values.app.secrets.certificates .Values.app.migrations.enabled }}
{{- with .Values.app.secrets.certificates }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-certificates-migrations
  namespace: {{ $.Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
{{- range . }}
  {{ .fileName }}: |-
{{ .cert | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
