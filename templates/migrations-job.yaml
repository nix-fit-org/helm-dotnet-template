---
{{- if .Values.app.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commonlib.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.app.migrations.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.app.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "commonlib.labels" . | nindent 8 }}
        tier: backend
        framework: dotnet
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      restartPolicy: OnFailure
      securityContext:
        {{- include "commonlib.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrations
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # ENTRYPOINT уже задан в docker-dotnet-template ("/dist/app")
          args: ["--run-migrations"]
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env-migrations
          env:
            {{- include "commonlib.envFromValues" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "commonlib.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.app.secrets.certificates }}
          volumeMounts:
            {{- $mountDir := $.Values.app.secrets.certificatesMountDir }}
            {{- range . }}
            - name: certificates
              mountPath: {{ printf "%s/%s" $mountDir .fileName }}
              subPath: {{ .fileName }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- with .Values.app.secrets.certificates }}
      volumes:
        - name: certificates
          secret:
            secretName: {{ $.Release.Name }}-certificates-migrations
      {{- end }}
{{- end }}
